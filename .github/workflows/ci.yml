name: CI
on:
  pull_request:
    branches: [main]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace  # Tier 1 + 2
      - run: cargo clippy --workspace -- -D warnings
