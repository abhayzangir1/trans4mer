name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Protobuf Compiler (protoc)
        uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - name: Install Linux Dependencies (WebKitGTK, OpenSSL & Protobuf)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev protobuf-compiler libprotobuf-dev

      - name: Verify Protoc
        run: protoc --version

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Core Workspace Tests
        run: cargo test --workspace --exclude trans4mers-desktop

      - name: Run Clippy Lints
        run: cargo clippy --workspace --exclude trans4mers-desktop -- -D warnings
